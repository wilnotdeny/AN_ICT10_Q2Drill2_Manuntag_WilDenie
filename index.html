<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Members</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

  <style>
    body { background-color: #f5f5f5; }
    h1 { color: #8b0000; }
    .btn-red { background-color: #8b0000; color: white; }
    .btn-red:hover { background-color: #660000; color: white; }
  </style>
</head>

<body>
  <div class="container mt-5" style="max-width: 600px;">

    <h1 class="text-center mb-4">Student Club Members</h1>

    <div class="card p-3 mb-4">
      <label>First Name</label>
      <input type="text" id="first" class="form-control mb-2">

      <label>Last Name</label>
      <input type="text" id="last" class="form-control mb-3">

      <button class="btn btn-red" id="add-btn">Add Member</button>
    </div>

    <div class="card p-3">
      <div id="output"></div>
    </div>

  </div>

  <script type="py" src="./main.py"></script>
</body>
</html>
